# Build + publish the Windows app whenever a version tag (v1.2.3) is pushed.
# Installed apps auto-update from the GitHub Release this creates (they read latest.yml from it).
name: Release desktop app

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write   # create the release and upload the installer

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_OWNER: ${{ github.repository_owner }}
      GH_REPO: ${{ github.event.repository.name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Run tests
        run: npm test

      - name: Use the tag as the app version
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version --workspace desktop

      # Build only; the update feed (GH_OWNER/GH_REPO) is baked in. Uploading is done below in one step,
      # because electron-builder's parallel uploader can create duplicate releases for the same tag.
      - name: Build installer
        run: npm run build:win

      - name: Write update manifest (latest.yml)
        shell: bash
        run: test -f desktop/dist/latest.yml || node desktop/scripts/latest-yml.mjs

      - name: Publish GitHub Release
        shell: bash
        run: |
          VERSION=$(node -p "require('./desktop/package.json').version")
          TAG="v${VERSION}"
          cd desktop/dist
          FILES=("IntelliTest-AI-Setup-${VERSION}.exe" "IntelliTest-AI-Setup-${VERSION}.exe.blockmap" "latest.yml")
          ls -la "${FILES[@]}"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" "${FILES[@]}" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "${FILES[@]}" --repo "$GITHUB_REPOSITORY" \
              --title "IntelliTest AI ${VERSION}" --generate-notes --latest
          fi
